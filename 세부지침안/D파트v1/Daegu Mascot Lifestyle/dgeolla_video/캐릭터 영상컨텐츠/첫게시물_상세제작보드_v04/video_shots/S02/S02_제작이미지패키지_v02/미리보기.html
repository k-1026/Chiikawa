<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S02 시작·중간·종료</title><style>body{background:#eef2ed;color:#213f34;font-family:sans-serif;margin:28px}main{display:flex;gap:18px}figure{margin:0;flex:1;max-width:400px}img{width:100%;border-radius:12px}figcaption{padding:10px 0}p{line-height:1.7}@media(max-width:650px){main{display:block}figure{margin-bottom:20px}}</style><h1>S02 조종석 · 시작 / 중간 / 종료</h1><p>닫힌 조종석 내부 고정 카메라. 작은 고개 이동의 포즈 참고입니다. 기존 오류 샘플은 제외했습니다.</p><main><figure><img src="01_START_정면주시.png"><figcaption>01_START_정면주시.png</figcaption></figure><figure><img src="02_MID_시선이동.png"><figcaption>02_MID_시선이동.png</figcaption></figure><figure><img src="03_END_조종간주시.png"><figcaption>03_END_조종간주시.png</figcaption></figure></main><p>기본 입력은 START입니다. MID·END는 선택한 영상 모델이 실제 지원하는 방식으로만 활용하세요.</p></html>
