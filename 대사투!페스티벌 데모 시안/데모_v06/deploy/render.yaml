services:
  - type: web
    name: daesatu-festival-v06-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL     # Supabase Session pooler 주소. Render 화면에서 직접 입력(Git에 올리지 않음)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIM
        sync: false
